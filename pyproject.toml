[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fairmmm"
version = "0.1.0"
description = "Individually fair clustering by smooth min-max-min optimisation (FMM)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Andrija Petrović" },
  { name = "Mladen Nikolić" },
]
keywords = ["clustering", "fairness", "individual fairness", "facility location", "k-means"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21", "torch>=1.13"]

[project.optional-dependencies]
experiments = ["pandas", "scikit-learn", "scipy", "matplotlib", "absl-py", "pyshp"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
